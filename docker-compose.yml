name: booking

services:
  booking-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-platform-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "${SQL_PORT:-1434}:1433"
    volumes:
      - booking-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  booking-api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: booking-api
    restart: unless-stopped
    depends_on:
      booking-sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Staging}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__BookingDatabase: "Server=booking-sql,1433;Database=${DB_NAME:-BookingDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Authentication__Jwt__Issuer: "Booking.Api"
      Authentication__Jwt__Audience: "Booking.BlazorApp"
      Authentication__Jwt__SigningKey: "${JWT_SIGNING_KEY:-}"
      Authentication__DevSeed__Enabled: "${AUTH_DEV_SEED_ENABLED:-false}"
      Authentication__DevSeed__SuperAdminEmail: "${DEV_SUPERADMIN_EMAIL:-superadmin@zambiq.local}"
      Authentication__DevSeed__SuperAdminPassword: "${DEV_SUPERADMIN_PASSWORD:-}"
      Authentication__DevSeed__OwnerPassword: "${DEV_OWNER_PASSWORD:-}"
      Authentication__DevSeed__StaffPassword: "${DEV_STAFF_PASSWORD:-}"
      Authentication__DevSeed__SecondOwnerPassword: "${DEV_SECOND_OWNER_PASSWORD:-}"
      Delivery__PublicBaseUrl: "${PUBLIC_API_URL:-http://localhost:5000}"
      WidgetAssets__PublicBaseUrl: "${PUBLIC_API_URL:-http://localhost:5000}"
      WidgetAssets__StoragePath: "/var/booking/widget-assets"
      Accounting__StoragePath: "/var/booking/accounting-assets"
      Accounting__GoCardless__SecretId: "${ACCOUNTING_GOCARDLESS_SECRET_ID:-}"
      Accounting__GoCardless__SecretKey: "${ACCOUNTING_GOCARDLESS_SECRET_KEY:-}"
      Accounting__GoCardless__RedirectUrl: "${ACCOUNTING_GOCARDLESS_REDIRECT_URL:-http://localhost:5001/admin/boekhouding/importeren}"
      Accounting__Mollie__ClientId: "${ACCOUNTING_MOLLIE_CLIENT_ID:-}"
      Accounting__Mollie__ClientSecret: "${ACCOUNTING_MOLLIE_CLIENT_SECRET:-}"
      Accounting__Mollie__RedirectUrl: "${ACCOUNTING_MOLLIE_REDIRECT_URL:-http://localhost:5001/admin/boekhouding/importeren}"
      DataProtection__KeysPath: "/var/booking/data-protection-keys"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - booking-api-data-protection:/var/booking/data-protection-keys
      - booking-widget-assets:/var/booking/widget-assets
      - booking-accounting-assets:/var/booking/accounting-assets

  booking-blazor:
    build:
      context: .
      dockerfile: Dockerfile.BlazorApp
    container_name: booking-blazor
    restart: unless-stopped
    depends_on:
      - booking-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Staging}"
      ASPNETCORE_URLS: "http://+:8080"
      BookingApi__BaseUrl: "${API_URL:-http://booking-api:8080}"
      DataProtection__KeysPath: "/var/booking/data-protection-keys"
      Widget__AllowedFrameAncestors: "${WIDGET_ALLOWED_FRAME_ANCESTORS:-'self'}"
    ports:
      - "${BLAZOR_PORT:-5001}:8080"
    volumes:
      - booking-blazor-data-protection:/var/booking/data-protection-keys

volumes:
  booking-sql-data:
  booking-api-data-protection:
  booking-widget-assets:
  booking-accounting-assets:
  booking-blazor-data-protection:
